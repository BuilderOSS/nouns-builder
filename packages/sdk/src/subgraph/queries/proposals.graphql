query proposals(
  $where: Proposal_filter
  $first: Int!
  $skip: Int
  $orderBy: Proposal_orderBy = proposalNumber
) {
  proposals(
    where: $where
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: desc
  ) {
    ...Proposal
    votes {
      ...ProposalVote
    }
  }
}
