query daosForDashboardUpdatable($user: Bytes!, $first: Int, $skip: Int) {
  daos(
    where: { or: [{ voters_: { voter: $user } }, { owners_: { owner: $user } }] }
    first: $first
    skip: $skip
  ) {
    ...DAO
    contractImage
    auctionConfig {
      minimumBidIncrement
      reservePrice
    }
    proposals(
      where: { executed_not: true, canceled_not: true, vetoed_not: true, replacedBy: null }
      first: 10
      skip: 0
      orderBy: proposalNumber
      orderDirection: desc
    ) {
      ...ProposalUpdatable
      voteEnd
      voteStart
      expiresAt
      votes {
        voter
      }
    }
    currentAuction {
      ...CurrentAuction
    }
  }
}
