#import "../fragments/Dao.graphql"
#import "../fragments/Proposal.graphql"
#import "../fragments/CurrentAuction.graphql"

query daosForDashboardViaProfile($user: ID!, $firstOwner: Int, $firstVoter: Int) {
  profile(id: $user) {
    id
    address
    ownerDaoCount
    voterDaoCount
    ownerDaos(first: $firstOwner, orderBy: lastActiveAt, orderDirection: desc) {
      id
      owner
      daoTokenCount
      dao {
        ...DAO
        contractImage
        auctionConfig {
          minimumBidIncrement
          reservePrice
        }
        proposals(
          where: { executed_not: true, canceled_not: true, vetoed_not: true }
          first: 10
          skip: 0
          orderBy: proposalNumber
          orderDirection: desc
        ) {
          ...Proposal
          voteEnd
          voteStart
          expiresAt
          votes {
            voter
          }
        }
        currentAuction {
          ...CurrentAuction
        }
      }
    }
    voterDaos(first: $firstVoter, orderBy: lastActiveAt, orderDirection: desc) {
      id
      voter
      dao {
        ...DAO
        contractImage
        auctionConfig {
          minimumBidIncrement
          reservePrice
        }
        proposals(
          where: { executed_not: true, canceled_not: true, vetoed_not: true }
          first: 10
          skip: 0
          orderBy: proposalNumber
          orderDirection: desc
        ) {
          ...Proposal
          voteEnd
          voteStart
          expiresAt
          votes {
            voter
          }
        }
        currentAuction {
          ...CurrentAuction
        }
      }
    }
  }
}
