fragment CandidateGroupFragment on ProposalCandidateGroup {
  id
  dao {
    id
    tokenAddress
    governorAddress
  }
  proposer
  salt
  createdAt
  candidateNumber
  versionCount
  commentCount
  latestVersionNumber
  currentForCount
  currentAgainstCount
  currentAbstainCount
  leadingVersion {
    title
  }
}

fragment CandidateGroupDetailFragment on ProposalCandidateGroup {
  id
  dao {
    id
    tokenAddress
    governorAddress
  }
  proposer
  salt
  createdAt
  candidateNumber
  versionCount
  commentCount
  latestVersionNumber
  currentForCount
  currentAgainstCount
  currentAbstainCount
  leadingVersion {
    ...CandidateVersionFragment
  }
  versions {
    ...CandidateVersionFragment
  }
}

fragment CandidateVersionFragment on ProposalCandidateVersion {
  id
  candidateId
  salt
  attester
  versionNumber
  targets
  values
  calldatas
  group {
    candidateNumber
  }
  title
  description
  metadata
  representedAddress
  proposalId
  createdAt
  discussionUrl
  signatureCount
  totalVoteWeight
  revoked
}

fragment CandidateCommentFragment on CandidateComment {
  id
  candidate
  commenter
  voteWeight
  support
  comment
  parentComment {
    id
  }
  createdAt
  revoked
}

fragment CandidateSponsorSignatureFragment on CandidateSponsorSignature {
  id
  signer
  proposalId
  nonce
  deadline
  signature
  revoked
  createdAt
  voteWeight
}

query CandidateGroupByNumber($candidateNumber: Int!, $dao: String) {
  proposalCandidateGroups(
    first: 1
    where: { candidateNumber: $candidateNumber, dao: $dao }
  ) {
    ...CandidateGroupDetailFragment
  }
}
