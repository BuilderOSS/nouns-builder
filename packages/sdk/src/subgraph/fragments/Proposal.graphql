fragment Proposal on Proposal {
  abstainVotes
  againstVotes
  calldatas
  description
  representedAddress
  discussionUrl
  descriptionHash
  executableFrom
  expiresAt
  forVotes
  proposalId
  proposalNumber
  proposalThreshold
  proposer
  quorumVotes
  targets
  timeCreated
  title
  values
  voteEnd
  voteStart
  snapshotBlockNumber
  transactionHash
  executedAt
  executionTransactionHash
  vetoTransactionHash
  cancelTransactionHash
  updatePeriodEnd
  updateMessage
  updateCount
  dao {
    governorAddress
    tokenAddress
  }
  candidateVersion {
    candidateId
    proposalId
    versionNumber
    group {
      candidateNumber
    }
  }
  replaces {
    proposalId
    proposalNumber
  }
  replacedBy {
    proposalId
    proposalNumber
  }
}
